name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  forge-tests:
    name: Forge Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # pinned: remappings handling differs between forge versions and changes KECCAK256_PROXY_CHILD_BYTECODE,
          # see "Keeping create3 addresses identical across chains" in README before bumping
          version: v1.8.1

      - name: Run tests
        run: forge test -vvv --isolate
        env:
          TESTNET_FORK_URL_BSC: ${{ secrets.TESTNET_FORK_URL_BSC }}
          TESTNET_FORK_URL_SEPOLIA: ${{ secrets.TESTNET_FORK_URL_SEPOLIA }}
